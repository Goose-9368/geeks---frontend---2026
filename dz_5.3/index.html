<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Конвертер валют SOM, USD и EUR">
  <title>Конвертер валют</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
<main class="page">
  <section class="converter" aria-labelledby="converter-title">
    <div class="converter__heading">
      <p class="converter__eyebrow">Актуальный курс валют</p>
      <h1 class="converter__title" id="converter-title">Конвертер валют</h1>
      <p class="converter__description">
        Введите сумму и выберите исходную валюту. Результат появится сразу
        в двух других валютах.
      </p>
    </div>

    <form class="converter__form" id="converter-form" novalidate>
      <div class="field">
        <label class="field__label" for="amount">Сумма</label>
        <input
                class="field__control"
                id="amount"
                name="amount"
                type="number"
                value="1000"
                min="0.01"
                step="0.01"
                inputmode="decimal"
                placeholder="Например, 1000"
                required
        >
      </div>

      <div class="field">
        <label class="field__label" for="currency">Исходная валюта</label>
        <select class="field__control" id="currency" name="currency">
          <option value="KGS">SOM — Кыргызский сом</option>
          <option value="USD">USD — Доллар США</option>
          <option value="EUR">EUR — Евро</option>
        </select>
      </div>

      <button class="button" id="convert-button" type="submit">
        <span class="button__text">Конвертировать</span>
        <span class="button__loader" aria-hidden="true"></span>
      </button>
    </form>

    <p class="message message--error" id="error-message" role="alert"></p>

    <section class="result" aria-labelledby="result-title">
      <div class="result__header">
        <div>
          <p class="result__caption">Результат</p>
          <h2 class="result__title" id="result-title">Конвертация</h2>
        </div>
        <p class="result__source" id="source-amount"></p>
      </div>

      <div class="result__list" id="result-list" aria-live="polite">
        <p class="result__placeholder">Здесь появятся результаты конвертации.</p>
      </div>

      <p class="result__updated" id="last-update"></p>
    </section>

    <a
            class="converter__credit"
            href="https://www.exchangerate-api.com"
            target="_blank"
            rel="noopener noreferrer"
    >
      Курсы предоставлены ExchangeRate-API
    </a>
  </section>
</main>
</body>
</html>
